    --bg:#0B0D10;

    --surface-2:#1B1F24;
    --border:#242930;
    --text:#EDEFF2;
    --muted:#8A93A0;

    --amber:#E8A93B;
    --red:#E5484D;
    --accent:#5B8DEF;

  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{background:var(--bg);color:var(--text);}
  body{font-family:'Inter',ui-sans-serif,system-ui,sans-serif;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;}

  @keyframes toastIn{from{opacity:0;transform:translate(-50%,-12px);}to{opacity:1;transform:translate(-50%,0);}}

<script type="text/babel" data-presets="react">

/* ============================== DATA ============================== */

const ALERT_SEED = [

    id:'al1',

    severity:'CRITICAL',
    message:'Exhibition Hall B is projected to exceed capacity within 20 minutes',
    cause:'High inflow toward the Robotics Exhibition, combined with limited hall capacity at Exhibition Hall B.',
    createdAt:'11:14 AM',
    resolved:false,
    prediction:[
      { label:'Now',   pct:90  },

      { label:'+20 min', pct:105 },

/* ============================== ENGINE ============================== */
// Pure, explainable functions — mirrors the CrowdIQ engine spec.

function pct(venue){ return Math.round((venue.occ / venue.capacity) * 100); }

function statusOf(venue){
  const p = pct(venue);
  if(p >= 90) return 'CRITICAL';
  if(p >= 75) return 'HIGH';
  if(p >= 50) return 'MEDIUM';
  return 'LOW';
}

function statusColor(status){
  if(status === 'CRITICAL') return 'var(--red)';
  if(status === 'HIGH') return 'var(--amber)';
  if(status === 'MEDIUM') return 'var(--accent)';
  return 'var(--green)';
}
function statusDot(status){
  if(status === 'CRITICAL' || status === 'HIGH') return '🔴';
  if(status === 'MEDIUM') return '🟠';
  return '🟢';
}
function statusLabel(status){
  if(status === 'CRITICAL') return 'Critical';
  if(status === 'HIGH') return 'High load';
  if(status === 'MEDIUM') return 'Watch';
  return 'Normal';
}

// score = effect*0.5 + (10-cost)*0.3 + convenience*0.2
function scoreRecommendation(r){
  return +(r.effect*0.5 + (10-r.cost)*0.3 + r.convenience*0.2).toFixed(1);
}

// linear-regression trend on a rolling occupancy history, projected N minutes out.
function predictTrend(history, horizonMin){
  if(!history || history.length < 2) return history && history.length ? history[history.length-1].occ : 0;
  const first = history[0], last = history[history.length-1];
  const n = history.length - 1;
  const slopePerTick = (last.occ - first.occ) / n; // occupancy change per tick (1 tick ~= 1 sim-minute)
  return Math.max(0, Math.round(last.occ + slopePerTick * horizonMin));
}

function findCause(venue, sessions){
  const s = sessions.find(s => s.venueId === venue.id && s.expected > 0);
  if(s) return `High inflow toward ${s.title}, combined with limited capacity at ${venue.name}.`;
  return `Sustained arrivals are outpacing the exit rate at ${venue.name}.`;
}

    users:   <><circle cx="9" cy="8" r="3.2"/><path d="M3 20c0-3.5 2.7-6 6-6s6 2.5 6 6"/><path d="M16 8.2a3 3 0 1 1 0 5.8"/><path d="M19.5 20c0-2.6-1.4-4.6-3.5-5.5"/></>,

  }[name];

      {p}

}

function Toast({ toast }){

        border: `1px solid ${toast.tone === 'critical' ? 'rgba(229,72,77,0.4)' : 'rgba(52,199,123,0.35)'}`,
        color: toast.tone === 'critical' ? '#FF9A9D' : '#7FE3AC',
      }}
    >

    </div>
  );
}

function MiniTrendChart({ points }){
  const w = 400, h = 160, pad = 28;
  const max = Math.max(120, ...points.map(p=>p.pct));
  const min = 0;
  const x = i => pad + (i/(points.length-1)) * (w - pad*2);
  const y = v => h - pad - ((v-min)/(max-min)) * (h - pad*2);
  const path = points.map((p,i)=>`${i===0?'M':'L'} ${x(i)} ${y(p.pct)}`).join(' ');
  const capY = y(100);
  return (
    <svg viewBox={`0 0 ${w} ${h}`} className="w-full h-40">
      <line x1={pad} y1={capY} x2={w-pad} y2={capY} stroke="var(--red)" strokeDasharray="4 4" strokeWidth="1"/>
      <text x={w-pad} y={capY-6} textAnchor="end" fontSize="10" fill="var(--red)">capacity</text>
      <path d={path} fill="none" stroke="var(--accent)" strokeWidth="2.5"/>
      {points.map((p,i)=>(
        <g key={i}>
          <circle cx={x(i)} cy={y(p.pct)} r="3.5" fill="var(--accent)"/>
          <text x={x(i)} y={h-8} textAnchor="middle" fontSize="10" fill="var(--muted)">{p.label}</text>
          <text x={x(i)} y={y(p.pct)-10} textAnchor="middle" fontSize="11" fill="var(--text)" fontFamily="'JetBrains Mono',monospace">{p.pct}%</text>
        </g>
      ))}
    </svg>
  );
}

/* ============================== SIMULATOR ============================== */

function Simulator({ venues, onCommit }){
  const [addVisitors, setAddVisitors] = useState(2000);
  const [atTime, setAtTime] = useState('4:00 PM');
  const [targetVenueId, setTargetVenueId] = useState('halA');
  const [result, setResult] = useState(null);

  function runSimulation(){
    const before = venues.map(v=>({...v}));
    const target = before.find(v=>v.id===targetVenueId);
    const overflow = Math.max(0, (target.occ + addVisitors) - target.capacity);
    const after = before.map(v => v.id === targetVenueId ? {...v, occ: v.occ + addVisitors - overflow} : v);

    // propagate overflow proportionally to spare capacity of other, non-parking-only venues
    const others = after.filter(v=>v.id!==targetVenueId);
    const totalSpare = others.reduce((s,v)=>s+Math.max(0, v.capacity - v.occ), 0) || 1;
    const afterPropagated = after.map(v=>{
      if(v.id===targetVenueId) return v;
      const spare = Math.max(0, v.capacity - v.occ);
      const share = Math.round((spare/totalSpare) * overflow);
      return {...v, occ: v.occ + share};
    });

    setResult({ before, after: afterPropagated, overflow });
  }

  function applyPreset(){
    setAddVisitors(2000); setAtTime('4:00 PM'); setTargetVenueId('halA');
  }

  return (
    <div className="p-6 md:p-8 grid grid-cols-1 lg:grid-cols-5 gap-6">
      <div className="lg:col-span-2 rounded-xl p-5 h-fit" style={{background:'var(--surface)', border:'1px solid var(--border)'}}>
        <h2 className="text-sm font-medium mb-4" style={{color:'var(--muted)'}}>What-if scenario</h2>
        <div className="flex flex-col gap-4">
          <div>
            <label className="text-xs block mb-1.5" style={{color:'var(--muted)'}}>Additional visitors</label>
            <input type="number" value={addVisitors} onChange={e=>setAddVisitors(parseInt(e.target.value)||0)}
              className="w-full rounded-lg px-3 py-2 text-sm font-mono" style={{background:'var(--surface-2)', border:'1px solid var(--border)', color:'var(--text)'}} />
          </div>
          <div>
            <label className="text-xs block mb-1.5" style={{color:'var(--muted)'}}>Arrival time</label>
            <input type="text" value={atTime} onChange={e=>setAtTime(e.target.value)}
              className="w-full rounded-lg px-3 py-2 text-sm font-mono" style={{background:'var(--surface-2)', border:'1px solid var(--border)', color:'var(--text)'}} />
          </div>
          <div>
            <label className="text-xs block mb-1.5" style={{color:'var(--muted)'}}>Target venue</label>
            <select value={targetVenueId} onChange={e=>setTargetVenueId(e.target.value)}
              className="w-full rounded-lg px-3 py-2 text-sm" style={{background:'var(--surface-2)', border:'1px solid var(--border)', color:'var(--text)'}}>
              {venues.map(v=><option key={v.id} value={v.id}>{v.name}</option>)}
            </select>
          </div>
          <button onClick={applyPreset} className="text-xs text-left" style={{color:'var(--accent)'}}>Use preset: +2,000 visitors at 4 PM → Exhibition Hall A</button>
          <button onClick={runSimulation} className="rounded-lg py-2.5 text-sm font-medium mt-1" style={{background:'var(--accent)', color:'#fff'}}>
            Run simulation
          </button>
        </div>
      </div>

      <div className="lg:col-span-3">
        {!result && (
          <div className="rounded-xl p-8 text-sm text-center h-full flex items-center justify-center" style={{background:'var(--surface)', border:'1px dashed var(--border)', color:'var(--muted)'}}>
            Run a scenario to see a before / after comparison across every zone.
          </div>
        )}
        {result && (
          <div className="rounded-xl overflow-hidden" style={{border:'1px solid var(--border)'}}>
            <table className="w-full text-sm">
              <thead>
                <tr style={{background:'var(--surface)', color:'var(--muted)'}}>
                  <th className="text-left font-normal px-4 py-3">Venue</th>
                  <th className="text-left font-normal px-4 py-3">Before</th>
                  <th className="text-left font-normal px-4 py-3">After</th>
                </tr>
              </thead>
              <tbody>
                {result.after.map((v,i)=>{
                  const bv = result.before[i];
                  const bSt = statusOf(bv), aSt = statusOf(v);
                  return (
                    <tr key={v.id} style={{borderTop:'1px solid var(--border)'}}>
                      <td className="px-4 py-3">{v.name}</td>
                      <td className="px-4 py-3"><span style={{color:statusColor(bSt)}} className="font-mono">{pct(bv)}%</span></td>
                      <td className="px-4 py-3"><span style={{color:statusColor(aSt)}} className="font-mono">{pct(v)}%</span></td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
            <div className="p-4 flex items-center justify-between" style={{background:'var(--surface)', borderTop:'1px solid var(--border)'}}>
              <span className="text-xs" style={{color:'var(--muted)'}}>
                {result.overflow > 0 ? `${result.overflow.toLocaleString()} visitors redistributed across nearby zones.` : 'No overflow — the target venue absorbs the load.'}
              </span>
              <button onClick={()=>{onCommit(result.after, `+${addVisitors.toLocaleString()} visitors at ${atTime}`); setResult(null);}} className="text-xs px-3 py-1.5 rounded-lg font-medium" style={{background:'var(--green)', color:'#08150F'}}>
                Commit plan
              </button>
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

function App(){
  const [stage, setStage] = useState('landing'); // landing | login | app
  const [profile, setProfile] = useState(null);
  const [view, setView] = useState('dashboard');
  const [venues, setVenues] = useState(VENUE_SEED);
  const [alerts, setAlerts] = useState(ALERT_SEED);
  const [selectedAlertId, setSelectedAlertId] = useState(null);
  const [historyLog, setHistoryLog] = useState([]);
  const [toast, setToast] = useState(null);
  const [loading, setLoading] = useState(true);
  const [pulseId, setPulseId] = useState(null);
  const historyRef = useRef({});

  useEffect(()=>{
    if(stage !== 'app') return;
    const t = setTimeout(()=>setLoading(false), 650);
    return ()=>clearTimeout(t);
  }, [stage]);

  // live tick: gentle random walk on occupancy + rolling history for predictTrend()
  useEffect(()=>{
    if(stage !== 'app') return;
    const interval = setInterval(()=>{
      setVenues(prev => prev.map(v=>{
        const drift = Math.round((Math.random()-0.45) * v.capacity * 0.02);
        const next = Math.max(0, Math.min(Math.round(v.capacity*1.3), v.occ + drift));
        const h = historyRef.current[v.id] || [];
        const updated = [...h, {occ: next}].slice(-12);
        historyRef.current[v.id] = updated;
        return {...v, occ: next};
      }));
    }, 6000);
    return ()=>clearInterval(interval);
  }, [stage]);

  function showToast(message, tone='ok'){
    setToast({message, tone});
    setTimeout(()=>setToast(null), 3200);
  }

  function applyRecommendation(alertId, recId){
    const alert = alerts.find(a=>a.id===alertId);
    const rec = alert.recommendations.find(r=>r.id===recId);
    if(rec.moveTo){
      setVenues(prev => prev.map(v=>{
        if(v.id === alert.venueId) return {...v, occ: Math.max(0, v.occ - rec.moveAmount)};
        if(v.id === rec.moveTo) return {...v, occ: v.occ + rec.moveAmount};
        return v;
      }));
    }
    setAlerts(prev => prev.map(a => a.id !== alertId ? a : {
      ...a, resolved:true,
      recommendations: a.recommendations.map(r => r.id===recId ? {...r, applied:true} : r),
    }));
    setPulseId(alert.venueId);
    setTimeout(()=>setPulseId(null), 1300);
    setHistoryLog(prev => [{ title: rec.label, time: 'just now', detail: `Applied to resolve the ${alert.severity.toLowerCase()} alert at ${venues.find(v=>v.id===alert.venueId)?.name}.` }, ...prev]);
    showToast('Plan applied — dashboard updated.');
  }

  function commitSimulation(afterVenues, label){
    setVenues(afterVenues);
    setHistoryLog(prev => [{ title: `Simulation committed: ${label}`, time:'just now', detail:'Live occupancy updated across all affected zones.' }, ...prev]);
    showToast('Simulation committed to live state.');
  }

  function overrideVenue(id, occ){
    setVenues(prev => prev.map(v => v.id===id ? {...v, occ} : v));
  }

  function openAlert(id){ setSelectedAlertId(id); setView('alerts'); }

  if(stage === 'landing') return <Landing onEnter={()=>setStage('login')} />;
  if(stage === 'login') return <Login onLogin={(p)=>{ setProfile(p); setStage('app'); }} />;

  const selectedAlert = alerts.find(a=>a.id===selectedAlertId);
  const titles = {
    dashboard:{t:'Command center', s:'TechNova 2026 · live overview'},
    alerts:{t: selectedAlert ? 'Alert detail' : 'Alerts', s: selectedAlert ? undefined : 'Every threshold breach, active and resolved'},
    venues:{t:'Venues', s:'All zones, gates and parking'},
    schedule:{t:'Schedule', s:'Sessions across both days'},
    simulate:{t:'What-if simulator', s:'Model an intervention before you commit to it'},
    history:{t:'History', s:'Applied plans this session'},
    visitor:{t:'Visitor app preview', s:'What attendees see on their phones'},
  };

  return (
    <div className="flex min-h-screen" style={{background:'var(--bg)'}}>
      <Toast toast={toast} />
      <Sidebar view={view} setView={(v)=>{setView(v); setSelectedAlertId(null);}} profile={profile} onLogout={()=>{setStage('landing'); setProfile(null); setView('dashboard');}} />
      <div className="flex-1 min-w-0">
        <TopBar title={titles[view].t} subtitle={titles[view].s} live={view==='dashboard'} />
        {view==='dashboard' && (
          <Dashboard venues={venues} alerts={alerts} sessions={SESSION_SEED} onOpenAlert={openAlert} setView={setView} loading={loading} />
        )}
        {view==='alerts' && !selectedAlert && (
          <AlertsList alerts={alerts} venues={venues} onOpen={openAlert} />
        )}
        {view==='alerts' && selectedAlert && (
          <AlertDetail
            alert={selectedAlert}
            venue={venues.find(v=>v.id===selectedAlert.venueId)}
            onApply={applyRecommendation}
            onBack={()=>setSelectedAlertId(null)}
            canApply={profile.role==='ORGANIZER'}
          />
        )}
        {view==='venues' && <Venues venues={venues} canEdit={profile.role==='ORGANIZER'} onOverride={overrideVenue} />}
        {view==='schedule' && <Schedule sessions={SESSION_SEED} venues={venues} />}
        {view==='simulate' && profile.role==='ORGANIZER' && <Simulator venues={venues} onCommit={commitSimulation} />}
        {view==='history' && profile.role==='ORGANIZER' && <HistoryLog log={historyLog} />}
        {view==='visitor' && <VisitorApp venues={venues} sessions={SESSION_SEED} />}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);

</script>
</body>
</html>
